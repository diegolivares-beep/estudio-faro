<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora — Diego Olivares · Estudio Faro</title>
<meta name="description" content="En qué está trabajando Diego Olivares: proyectos, estados e hitos.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --panel:#faf8f3;
  --line:rgba(15,38,44,.12);
  --line-2:rgba(15,38,44,.2);
  --ink:#0f262c;
  --muted:#51666b;
  --accent:#c97e16;
  --accent-deep:#8a611a;
  --accent-tint:rgba(201,126,22,.1);
  --teal:#1e6f68;
  --font-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-b:"Hanken Grotesk",system-ui,sans-serif;
  --topbar:56px;
  --sidebar:264px;
  --z-sidebar:30; --z-backdrop:25; --z-topbar:40;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-b);font-size:.95rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(245,182,92,.5)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--teal)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- topbar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar);z-index:var(--z-topbar);
  background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:.4rem;padding:0 1rem;
}
.burger{display:none;padding:.5rem;margin-left:-.5rem;border-radius:8px;color:var(--muted)}
.burger:hover{background:var(--panel);color:var(--ink)}
.wordmark{display:flex;align-items:baseline;gap:.5rem;margin-right:1.4rem;white-space:nowrap}
.wordmark .b{font-family:var(--font-d);font-weight:800;font-size:1.06rem;letter-spacing:-.02em}
.wordmark .b .dot{color:var(--accent)}
.wordmark .s{font-size:.78rem;font-weight:600;color:var(--muted)}
.views{display:flex;gap:.25rem;height:100%}
.views a{
  display:flex;align-items:center;padding:0 .85rem;position:relative;
  font-weight:600;font-size:.88rem;color:var(--muted);text-decoration:none;white-space:nowrap;
}
.views a:hover{color:var(--ink)}
.views a[aria-current="true"]{color:var(--ink)}
.views a[aria-current="true"]::after{
  content:"";position:absolute;left:.85rem;right:.85rem;bottom:-1px;height:2px;background:var(--accent);
}
.topbar .right{margin-left:auto;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap}
.topbar .right .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:.4rem;vertical-align:1px}
@media (max-width:720px){ .topbar .right{display:none} }
@media (max-width:520px){
  .wordmark{margin-right:.6rem}
  .wordmark .s{display:none}
  .views a{padding:0 .6rem;font-size:.84rem}
}

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed;top:var(--topbar);bottom:0;left:0;width:var(--sidebar);z-index:var(--z-sidebar);
  background:var(--panel);border-right:1px solid var(--line);
  overflow-y:auto;padding:.9rem .7rem 1.4rem;
}
.sb-group{margin-bottom:1.1rem}
.sb-title{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:.3rem .55rem;font-size:.72rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.sb-title .n{font-weight:600}
.sidebar a{
  display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;
  padding:.42rem .55rem;border-radius:8px;text-decoration:none;
  color:var(--ink);font-size:.9rem;font-weight:500;
}
.sidebar a:hover{background:rgba(15,38,44,.05)}
.sidebar a[aria-current="true"]{background:var(--accent-tint);font-weight:700}
.sidebar a .tg{font-size:.72rem;color:var(--muted);font-weight:500;white-space:nowrap}
.sidebar .off a{color:var(--muted)}
.sidebar .off a:hover{color:var(--ink)}
.backdrop{
  display:none;position:fixed;inset:var(--topbar) 0 0 0;z-index:var(--z-backdrop);
  background:rgba(15,38,44,.35);
}

/* ---------- main ---------- */
main{margin-left:var(--sidebar);padding:calc(var(--topbar) + 1.8rem) clamp(1.1rem,3.5vw,2.4rem) 3.5rem;max-width:calc(var(--sidebar) + 940px)}
.crumb{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:.5rem}
.crumb a{color:var(--muted);text-decoration:none}
.crumb a:hover{color:var(--ink);text-decoration:underline}
h1{font-family:var(--font-b);font-weight:700;font-size:1.5rem;letter-spacing:-.015em;line-height:1.25;text-wrap:balance}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-bottom:.35rem}
.pagesub{color:var(--muted);max-width:64ch;margin-bottom:1.8rem}
h2{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;margin:2.2rem 0 .9rem}
h2:first-of-type{margin-top:0}

.badge{
  font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:99px;padding:.14rem .6rem;white-space:nowrap;
}
.badge.activo{color:var(--accent-deep);background:var(--accent-tint)}
.badge.pausa{color:var(--muted);border:1px solid var(--line-2)}
.badge.entregado{color:#fff;background:var(--teal)}
.badge.descartado{color:var(--muted);border:1px solid var(--line)}
.tg-chip{font-size:.78rem;font-weight:600;color:var(--muted)}

/* resumen */
.semana{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;
}
.semana>div{background:var(--bg);padding:.85rem 1rem}
.semana .dias{font-size:.76rem;font-weight:700;color:var(--accent-deep)}
.semana .que{font-weight:700;margin-top:.1rem}
.semana .det{font-size:.82rem;color:var(--muted)}
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{
  display:grid;grid-template-columns:minmax(160px,240px) 1fr auto;gap:.3rem 1.2rem;align-items:baseline;
  padding:.75rem 1rem;text-decoration:none;color:var(--ink);
  border-bottom:1px solid var(--line);background:var(--bg);
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel)}
.row .n{font-weight:700;font-size:.93rem}
.row .n small{display:block;font-weight:500;font-size:.76rem;color:var(--muted)}
.row .d{color:var(--muted);font-size:.88rem;max-width:62ch}
.row .f{font-size:.78rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:680px){ .row{grid-template-columns:1fr auto} .row .d{grid-column:1 / -1} }
.morelink{display:inline-block;margin-top:.7rem;font-size:.86rem;font-weight:600}

/* timeline */
.tl{position:relative;padding-left:1.5rem;max-width:72ch}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.mes{font-weight:700;font-size:.86rem;color:var(--muted);text-transform:capitalize;margin:1.6rem 0 .8rem;position:relative}
.mes:first-child{margin-top:0}
.evt{position:relative;padding:0 0 1.05rem}
.evt:last-child{padding-bottom:0}
.evt::before{
  content:"";position:absolute;left:-1.5rem;top:.42em;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:2.5px solid var(--muted);
}
.evt[data-tipo="venta"]::before{border-color:var(--accent);background:var(--accent)}
.evt[data-tipo="entrega"]::before{border-color:var(--teal);background:var(--teal)}
.evt[data-tipo="decision"]::before{border-color:var(--accent)}
.evt .meta{display:flex;flex-wrap:wrap;gap:.55rem;align-items:baseline;font-size:.8rem}
.evt .meta time{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.evt .meta .p{font-weight:700}
.evt .meta a.p{color:var(--ink);text-decoration:none}
.evt .meta a.p:hover{text-decoration:underline}
.evt .meta .t{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.68rem}
.evt[data-tipo="venta"] .meta .t,.evt[data-tipo="decision"] .meta .t{color:var(--accent-deep)}
.evt[data-tipo="entrega"] .meta .t{color:var(--teal)}
.evt[data-tipo="hito"] .meta .t{display:none}
.evt p{color:var(--muted);font-size:.9rem;max-width:62ch;margin-top:.08rem}

/* ficha proyecto */
.ficha{max-width:70ch}
.ficha .que{color:var(--muted);margin-bottom:1.4rem;font-size:.97rem}
.kv{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:2rem}
.kv>div{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--bg)}
.kv>div:last-child{border-bottom:0}
.kv .k{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:.15rem}
.kv .v{font-size:.92rem}
.kv .v time{color:var(--muted);font-size:.82rem;font-weight:600}
.empty{color:var(--muted);font-size:.9rem;border:1px dashed var(--line-2);border-radius:10px;padding:1rem 1.2rem;max-width:62ch}

#estado-carga{color:var(--muted)}
.hide{display:none}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .burger{display:block}
  .sidebar{transform:translateX(-100%);transition:transform .2s ease-out;box-shadow:none}
  body.nav-open .sidebar{transform:none;box-shadow:0 8px 30px rgba(15,38,44,.18)}
  body.nav-open .backdrop{display:block}
  main{margin-left:0}
  @media (prefers-reduced-motion: reduce){ .sidebar{transition:none} }
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" aria-label="Abrir navegación" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <div class="wordmark">
    <span class="b">Bitácora<span class="dot">.</span></span>
    <span class="s">Diego Olivares</span>
  </div>
  <nav class="views" aria-label="Vistas">
    <a href="#resumen" data-view="resumen">Resumen</a>
    <a href="#timeline" data-view="timeline">Línea de tiempo</a>
  </nav>
  <div class="right" id="updated"></div>
</header>

<nav class="sidebar" id="sidebar" aria-label="Proyectos"></nav>
<div class="backdrop" id="backdrop"></div>

<main id="main">
  <p id="estado-carga">Cargando la bitácora…</p>
  <div id="vista" class="hide"></div>
</main>

<noscript><div style="padding:5rem 2rem">Esta página necesita JavaScript para mostrar los datos.</div></noscript>

<script>
const PB = "https://panel.estudiofaro.cl/api/collections";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const TIPO_LABEL = { venta:"Venta", entrega:"Entrega", decision:"Decisión", hito:"" };
const GRUPOS = [
  { estado:"activo",     titulo:"Activos" },
  { estado:"pausa",      titulo:"En pausa" },
  { estado:"entregado",  titulo:"Entregado" },
  { estado:"descartado", titulo:"Descartado" },
];
let DATA = null;

function fShort(iso){ const [y,m,d] = iso.split("-").map(Number); return `${d} ${MESES[m-1].slice(0,3)}`; }
function fLong(iso){ const [y,m,d] = iso.split("-").map(Number); return `${d} de ${MESES[m-1]} de ${y}`; }
function esc(s){ const el = document.createElement("span"); el.textContent = s ?? ""; return el.innerHTML; }

async function pbList(col, params){
  const res = await fetch(`${PB}/${col}/records?perPage=200&${params}`, {cache:"no-store"});
  if(!res.ok) throw new Error(`${col}: ${res.status}`);
  return (await res.json()).items;
}

/* Fuente primaria: PocketBase (datos vivos). Fallback: data.json (última foto estática). */
async function loadData(){
  try{
    const [cfg, pros, hitos] = await Promise.all([
      pbList("bitacora_config",""),
      pbList("bitacora_proyectos","sort=orden"),
      pbList("bitacora_hitos","sort=-fecha"),
    ]);
    const c = cfg[0];
    return {
      updated: c.updated, intro: c.intro, semana: c.semana,
      proyectos: pros.map(p => ({
        id: p.slug, nombre: p.nombre, tag: p.tag, estado: p.estado, que: p.que,
        novedad: p.novedad_texto ? { fecha: p.novedad_fecha, texto: p.novedad_texto } : null,
        siguiente: p.siguiente || null,
      })),
      hitos: hitos.map(h => ({ fecha: h.fecha, tipo: h.tipo, proyecto: h.proyecto, slug: h.slug || "", texto: h.texto })),
    };
  }catch(e){
    const res = await fetch("data.json", {cache:"no-store"});
    if(!res.ok) throw e;
    return await res.json();
  }
}

/* ---------- render: sidebar ---------- */
function renderSidebar(sel){
  document.getElementById("sidebar").innerHTML = GRUPOS.map(g => {
    const items = DATA.proyectos.filter(p => p.estado === g.estado);
    if(!items.length) return "";
    return `
      <div class="sb-group ${g.estado === "activo" ? "" : "off"}">
        <div class="sb-title"><span>${g.titulo}</span><span class="n">${items.length}</span></div>
        ${items.map(p => `
          <a href="#p/${esc(p.id)}" ${sel === "p/"+p.id ? 'aria-current="true"' : ""}>
            <span>${esc(p.nombre)}</span><span class="tg">${esc(p.tag)}</span>
          </a>
        `).join("")}
      </div>
    `;
  }).join("");
}

/* ---------- render: vistas ---------- */
function hitosHTML(hitos, linkProyecto){
  const porMes = {};
  for(const h of hitos){
    const [y,m] = h.fecha.split("-");
    const k = `${MESES[Number(m)-1]} ${y}`;
    (porMes[k] = porMes[k] || []).push(h);
  }
  return `<div class="tl">` + Object.entries(porMes).map(([mes, evts]) => `
    <div class="mes">${esc(mes)}</div>
    ${evts.map(h => `
      <div class="evt" data-tipo="${esc(h.tipo)}">
        <div class="meta">
          <time datetime="${h.fecha}">${fShort(h.fecha)}</time>
          ${linkProyecto && h.slug
            ? `<a class="p" href="#p/${esc(h.slug)}">${esc(h.proyecto)}</a>`
            : `<span class="p">${esc(h.proyecto)}</span>`}
          <span class="t">${TIPO_LABEL[h.tipo] ?? ""}</span>
        </div>
        <p>${esc(h.texto)}</p>
      </div>
    `).join("")}
  `).join("") + `</div>`;
}

function vistaResumen(){
  const activos = DATA.proyectos.filter(p => p.estado === "activo");
  return `
    <div class="pagehead"><h1>Resumen</h1></div>
    <p class="pagesub">${esc(DATA.intro)}</p>
    <h2>La semana</h2>
    <div class="semana">${DATA.semana.map(s => `
      <div><div class="dias">${esc(s.dias)}</div><div class="que">${esc(s.que)}</div><div class="det">${esc(s.detalle)}</div></div>
    `).join("")}</div>
    <h2>Activos ahora</h2>
    <div class="rows">${activos.map(p => `
      <a class="row" href="#p/${esc(p.id)}">
        <span class="n">${esc(p.nombre)}<small>${esc(p.tag)}</small></span>
        <span class="d">${p.novedad ? esc(p.novedad.texto) : esc(p.que)}</span>
        <span class="f">${p.novedad ? fShort(p.novedad.fecha) : ""}</span>
      </a>
    `).join("")}</div>
    <h2>Últimos hitos</h2>
    ${hitosHTML(DATA.hitos.slice(0,5), true)}
    <a class="morelink" href="#timeline">Ver la línea de tiempo completa</a>
  `;
}

function vistaTimeline(){
  return `
    <div class="pagehead"><h1>Línea de tiempo</h1></div>
    <p class="pagesub">Hitos con fecha: ventas, entregas, decisiones de rumbo. Lo más reciente arriba.</p>
    ${hitosHTML(DATA.hitos, true)}
  `;
}

function vistaProyecto(slug){
  const p = DATA.proyectos.find(x => x.id === slug);
  if(!p) return `<div class="pagehead"><h1>Proyecto no encontrado</h1></div><p class="pagesub">Vuelve al <a href="#resumen">resumen</a>.</p>`;
  const hitos = DATA.hitos.filter(h => h.slug === slug);
  document.title = `${p.nombre} — Bitácora`;
  return `
    <div class="ficha">
      <p class="crumb"><a href="#resumen">Resumen</a> / ${esc(p.nombre)}</p>
      <div class="pagehead">
        <h1>${esc(p.nombre)}</h1>
        <span class="badge ${esc(p.estado)}">${esc(p.estado)}</span>
        <span class="tg-chip">${esc(p.tag)}</span>
      </div>
      <p class="que">${esc(p.que)}</p>
      ${(p.novedad || p.siguiente) ? `<div class="kv">
        ${p.novedad ? `<div><span class="k">Última novedad</span><span class="v">${esc(p.novedad.texto)} <time datetime="${p.novedad.fecha}">· ${fShort(p.novedad.fecha)}</time></span></div>` : ""}
        ${p.siguiente ? `<div><span class="k">Siguiente</span><span class="v">${esc(p.siguiente)}</span></div>` : ""}
      </div>` : ""}
      <h2>Hitos del proyecto</h2>
      ${hitos.length ? hitosHTML(hitos, false) : `<p class="empty">Sin hitos registrados para este proyecto todavía.</p>`}
    </div>
  `;
}

/* ---------- router ---------- */
function route(){
  if(!DATA) return;
  const h = (location.hash || "#resumen").slice(1);
  let html, view = h;
  if(h.startsWith("p/")) html = vistaProyecto(h.slice(2));
  else if(h === "timeline"){ html = vistaTimeline(); document.title = "Línea de tiempo — Bitácora"; }
  else { view = "resumen"; html = vistaResumen(); document.title = "Bitácora — Diego Olivares · Estudio Faro"; }
  document.getElementById("vista").innerHTML = html;
  renderSidebar(view.startsWith("p/") ? view : "");
  document.querySelectorAll(".views a").forEach(a =>
    a.setAttribute("aria-current", a.dataset.view === view ? "true" : "false"));
  closeNav();
  document.getElementById("main").scrollIntoView({block:"start"});
  window.scrollTo(0,0);
}

/* ---------- nav móvil ---------- */
function closeNav(){
  document.body.classList.remove("nav-open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
}
document.getElementById("burger").addEventListener("click", () => {
  const open = document.body.classList.toggle("nav-open");
  document.getElementById("burger").setAttribute("aria-expanded", String(open));
});
document.getElementById("backdrop").addEventListener("click", closeNav);
window.addEventListener("hashchange", route);

/* ---------- init ---------- */
(async () => {
  try{ DATA = await loadData(); }
  catch(e){
    document.getElementById("estado-carga").textContent = "No se pudo cargar la bitácora. Recarga la página o avísale a Diego.";
    return;
  }
  document.getElementById("updated").innerHTML = `<span class="dot"></span>Actualizada el ${fLong(DATA.updated)}`;
  document.getElementById("estado-carga").classList.add("hide");
  document.getElementById("vista").classList.remove("hide");
  route();
})();
</script>
</body>
</html>
