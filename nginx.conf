# Bitacora privada (bitacora.estudiofaro.cl) — sirve solo /bitacora, sin indexacion
server {
    listen 80;
    server_name bitacora.estudiofaro.cl;
    root /usr/share/nginx/html/bitacora;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # favicon compartido del sitio principal
    location = /favicon.svg {
        root /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Carta digital: URLs limpias /carta/<negocio> y /carta/<negocio>/editar -> SPA
    location /carta/ {
        try_files $uri $uri/ /carta/index.html;
    }

    # Resto del sitio (raiz, /app, /demos, /printia, assets) sirve estatico normal
    location / {
        try_files $uri $uri/ =404;
    }
}
