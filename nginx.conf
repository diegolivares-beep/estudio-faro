# Bitacora privada (bitacora.estudiofaro.cl) — sirve solo /bitacora, sin indexacion
server {
    listen 80;
    server_name bitacora.estudiofaro.cl;
    root /usr/share/nginx/html/bitacora;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # favicon compartido del sitio principal
    location = /favicon.svg {
        root /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad. HSTS NO va aca: nginx escucha en :80 detras de
    # Traefik, el TLS lo termina Coolify, asi que Strict-Transport-Security
    # tiene que configurarse alla o se emite sobre HTTP y los navegadores lo ignoran.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # Carta digital: URLs limpias /carta/<negocio> y /carta/<negocio>/editar -> SPA
    location /carta/ {
        try_files $uri $uri/ /carta/index.html;
    }

    # Resto del sitio (raiz, /app, /demos, /printia, assets) sirve estatico normal
    location / {
        try_files $uri $uri/ =404;
    }
}
